services:
  sglang:
    image: lmsysorg/sglang:latest
    container_name: whiterabbitneo-sglang
    entrypoint: /bin/bash
    command: /start.sh
    env_file:
      - .env
    volumes:
      - ./start.sh:/start.sh:ro
      - hf-cache:/root/.cache/huggingface
    ports:
      - "30000:30000"
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:30000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  hf-cache:
